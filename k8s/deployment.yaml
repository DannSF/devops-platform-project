apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-platform-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-platform-app
  
  template:
    metadata:
      labels:
        app: devops-platform-app
  
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: app
          image: 779686178234.dkr.ecr.ap-southeast-2.amazonaws.com/devops-platform-app:1.0
          ports:
            - containerPort: 3000

